name: Build Dead Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          find "$ANDROID_SDK_ROOT" -name sdkmanager -type f -print

      - name: Configure Android SDK tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 34 and Build Tools
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          echo "Checking Android SDK..."

          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/d8"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

          echo "Android SDK verification successful"

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: ./build.sh

      - name: Verify APK
        run: |
          test -f DEADZONE_MVP_0.1.0.apk
          ls -lh DEADZONE_MVP_0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeadZone-MVP-APK
          path: DEADZONE_MVP_0.1.0.apk
          if-no-files-found: error
          retention-days: 30
