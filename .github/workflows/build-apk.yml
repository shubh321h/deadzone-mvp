name: Build DEAD ZONE APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK directory
        run: sudo mkdir -p /home/user && sudo chown -R $USER:$USER /home/user

      - name: Fetch Android SDK (platform-34 + build-tools 34.0.0)
        run: bash tools/setup_sdk.sh

      - name: Build signed APK
        run: bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadzone-apk
          path: "*.apk"
