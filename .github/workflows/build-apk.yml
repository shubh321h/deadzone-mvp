name: Build Dead Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Dead Zone Android APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_VERSION: '17'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          java -version
          javac -version
          keytool -help >/dev/null

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/34.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"

          echo "Android SDK:"
          ls -ld "$ANDROID_HOME"

          echo "Android platform:"
          ls -lh "$ANDROID_HOME/platforms/android-34/android.jar"

          echo "Build tools:"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" version
"$ANDROID_HOME/build-tools/34.0.0/d8" --version
"$ANDROID_HOME/build-tools/34.0.0/apksigner" version

echo "zipalign found:"
ls -lh "$ANDROID_HOME/build-tools/34.0.0/zipalign"

echo "ANDROID SDK VERIFICATION PASSED"

          echo "ANDROID SDK VERIFICATION PASSED"

      - name: Check project files
        run: |
          test -f build.sh
          test -f AndroidManifest.xml
          test -d src
          test -d res
          test -d assets

          echo "Project structure:"
          ls -la
          echo
          echo "Source files: $(find src -name '*.java' | wc -l)"
          echo "Asset files: $(find assets -type f | wc -l)"

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build Dead Zone APK
        run: |
          ./build.sh

      - name: Verify generated APK
        run: |
          test -f DEADZONE_0.3.0.apk

          echo "APK successfully generated:"
          ls -lh DEADZONE_0.3.0.apk

          echo "APK file information:"
          file DEADZONE_0.3.0.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose \
            DEADZONE_0.3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeadZone-0.3.0-APK
          path: DEADZONE_0.3.0.apk
          if-no-files-found: error
          retention-days: 30
